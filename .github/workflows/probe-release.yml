name: probe release assets

# 诊断用：比较两种发布方式对 /releases/tags/<tag> 内嵌 assets 字段的影响。
#
# 背景：本仓库 08:37 之后由 softprops/action-gh-release 创建的 Release，
# /releases/tags/<tag> 返回的 assets 恒为 0，而 /releases/{id}/assets 正常。
# CPA 的 FetchReleaseByTag 解析的正是前者，因此插件装不上。
#
# 本工作流用 gh CLI 创建同名资产形态的 Release，看内嵌字段是否正常。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make a tiny asset
        run: |
          mkdir -p probe
          echo "probe payload $(date -u +%s)" > probe/payload.txt
          printf '%s  %s\n' "$(sha256sum probe/payload.txt | awk '{print $1}')" "aigw-reverse-proxy_0.0.1_linux_amd64.zip" > probe/checksums.txt
          cp probe/payload.txt probe/aigw-reverse-proxy_0.0.1_linux_amd64.zip
          ls -la probe/

      - name: Create release via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create probe-gh-cli \
            --title "probe-gh-cli" \
            --notes "diagnostic" \
            probe/aigw-reverse-proxy_0.0.1_linux_amd64.zip \
            probe/checksums.txt

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== tags endpoint ==="
          gh api "repos/${{ github.repository }}/releases/tags/probe-gh-cli" --jq '.assets | length'
          echo "=== assets endpoint ==="
          gh api "repos/${{ github.repository }}/releases/tags/probe-gh-cli" --jq '.id' \
            | xargs -I{} gh api "repos/${{ github.repository }}/releases/{}/assets" --jq 'length'
