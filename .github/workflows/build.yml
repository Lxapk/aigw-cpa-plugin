# Build CPA plugin — 仅构建 amd64 (.so) 并发布
#
# arm64 的 .so 需要原生 arm64 C 工具链编译 c-shared，
# ubuntu-24.04-arm runner 缺少完整的 C 编译器工具链，
# 且你服务器是 x86_64，只需要 amd64 版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        default: "0.9.0"

permissions:
  contents: write

env:
  PLUGIN_ID: aigw-reverse-proxy
  PLUGIN_NAME: "WorkBuddy"

jobs:
  build:
    name: build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev

      - name: Test
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: Build .so (c-shared)
        env: {CGO_ENABLED: "1", CC: gcc, GOOS: linux, GOARCH: amd64}
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -o dist/aigw-reverse-proxy.so .
          readelf -h dist/aigw-reverse-proxy.so | grep Machine
          nm -D --defined-only dist/aigw-reverse-proxy.so | grep cliproxy_plugin_init
          go build -o dist/smoke ./smoke
          ./dist/smoke dist/aigw-reverse-proxy.so

      - uses: actions/upload-artifact@v4
        with:
          name: aigw-reverse-proxy-linux-amd64
          path: dist/aigw-reverse-proxy.so

  package:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${GITHUB_REF#refs/tags/}"; V="${V#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          python3 scripts/build_release.py \
            --id "${PLUGIN_ID}" \
            --version "${{ steps.ver.outputs.version }}" \
            --amd64 dist/aigw-reverse-proxy-linux-amd64/aigw-reverse-proxy.so \
            --out release
          python3 scripts/build_direct_registry.py \
            --id "${PLUGIN_ID}" --name "${PLUGIN_NAME}" \
            --version "${{ steps.ver.outputs.version }}" \
            --repo "${{ github.server_url }}/${{ github.repository }}" \
            --tag "v${{ steps.ver.outputs.version }}" \
            --checksums release/checksums.txt \
            --author TaiXu \
            --out registry.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/checksums.txt
            registry.json
          generate_release_notes: true

      # self-check
      - name: Verify
        id: ver2
        run: |
          count=$(gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.ver.outputs.version }}" \
            --jq '.assets | length' 2>/dev/null || echo 0)
          echo "assets in release: ${count}"
          [[ "${count}" -ge 3 ]] || { echo "assets count < 3"; exit 1; }